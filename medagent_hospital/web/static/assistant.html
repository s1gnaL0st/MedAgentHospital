<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedAgent-Hospital · 辅助诊断</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/assistant.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span>MedAgent-Hospital</span>
    </div>
    <nav class="tabs">
      <a class="tab" href="/">医院模拟</a>
      <a class="tab active" href="/assistant">辅助诊断</a>
    </nav>
    <div class="status"><span class="dot"></span><span>医生决策支持</span></div>
  </header>

  <main class="assistant-main">
    <aside class="panel rail">
      <h2>流程</h2>
      <ol id="stageList" class="stage-list">
        <li data-stage="guide"><span class="stage-index">1</span><span>导医分诊</span></li>
        <li data-stage="doctor"><span class="stage-index">2</span><span>主诊问诊/开单</span></li>
        <li data-stage="chief"><span class="stage-index">3</span><span>主任复核</span></li>
      </ol>
      <div class="rail-note muted">导医、主诊、主任各有独立对话窗口。Agent 只提建议，医生可讨论、反驳后再确认。</div>
    </aside>

    <section class="main-col">
      <div class="chat-head">
        <h2>角色对话</h2>
        <button id="newSessionBtn" class="btn ghost" type="button">新建会话</button>
      </div>

      <form id="startForm" class="start-form">
        <div class="form-grid">
          <label>性别
            <select id="genderInput">
              <option value="any">不限</option>
              <option value="male">男</option>
              <option value="female">女</option>
            </select>
          </label>
          <label>年龄
            <input id="ageInput" type="number" min="0" max="120" value="45">
          </label>
          <label class="wide">症状（逗号分隔，支持语音）
            <div class="voice-row">
              <textarea id="symptomsInput" rows="2" placeholder="发热,咳嗽,胸痛"></textarea>
              <button id="dictateBtn" class="btn ghost" type="button">语音转文字</button>
            </div>
          </label>
          <label class="wide">既往史
            <input id="historyInput" type="text" placeholder="高血压,糖尿病">
          </label>
          <label class="wide">危险因素
            <input id="riskInput" type="text" placeholder="吸烟,高龄">
          </label>
        </div>
        <div class="form-actions">
          <button id="startBtn" class="btn primary" type="submit">开始辅助诊断</button>
          <span id="startError" class="form-error"></span>
        </div>
      </form>

      <div id="roleGrid" class="role-grid"></div>
    </section>

    <aside class="panel side">
      <h2>患者信息</h2>
      <div id="patientPanel" class="muted empty">尚未开始会话</div>
      <h2>医嘱记录</h2>
      <div id="orderPanel" class="muted empty">尚未开单</div>
    </aside>
  </main>

  <script src="/assistant.js"></script>
</body>
</html>
